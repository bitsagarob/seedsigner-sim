# Runs each upstream SeedSigner's own test suite against the dependency versions
# this repository pins for it.
#
# This repository ships a great deal of upstream code verbatim and around 1,600
# lines of its own. Writing our own tests for the wallet's behaviour is
# reinventing a wheel upstream already turns: both firmwares ship a pytest suite
# written by the people who wrote the code it tests. Running them costs one job
# and nothing else, and they are a much better check of the wallet than anything
# we would think to write.
#
# The reason it is worth running *here* rather than just trusting that upstream
# runs it is build/build-wallet-zip.sh. That script chooses its own dependency
# versions, each by exact version and sha256, because a wallet zip has to be
# assembled by hand from content-addressed artifacts to be reproducible.
# Upstream tests against whatever their requirements.txt resolves to. Those two
# sets agree today, and nothing enforces that they keep agreeing. This job is
# what says so: it installs OUR pins and runs THEIR tests, so the day a repin
# moves us off what upstream's code expects, a test written by upstream goes red
# and names the behaviour that changed.
#
# Nothing is vendored. Each suite is cloned at CI time from the same commit
# UPSTREAM pins that firmware's wallet to, read out of that file at runtime
# rather than copied into this workflow: a sha written down here would silently
# rot the day we repin, which is exactly the day this job needs to be right. No
# test file enters this repository and nothing here touches a wallet zip.
#
# Its own workflow, like reproducible-build.yml, so it goes red under its own
# name and against its own question. It must not share test.yml's cache: that
# cache holds built wallet zips and a Pyodide runtime, none of which this job
# has any use for, and a job whose whole point is "install these exact versions"
# should install them rather than find them lying around. So there is no
# actions/cache here at all; see the note on pip caching below.
name: upstream-tests

on:
  # Pushes only on the default branch, and every pull request. A
  # contributor's branch is tested when they open the PR, rather than
  # twice for every push once they have.
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-24.04
    # The smartcard suite is about six minutes, most of it waiting on gpg
    # subprocesses generating keys rather than on CPU. The stock suite is about
    # three seconds, because stock has no gpg tests. Both run on CPython, not in
    # a browser, so neither is anything like test.yml's cost.
    timeout-minutes: 20

    name: ${{ matrix.firmware }}

    # A matrix, and it is genuinely the simpler shape. The five substantial
    # steps (clone the pin, read our table, install, list, run) are the same
    # steps asking the same question of both firmwares, and the places the two
    # differ are small enough to be data: which section of UPSTREAM to read,
    # which lines of upstream's requirements.txt name a dependency a wallet zip
    # cannot carry, how many of those there should be, and what pytest needs
    # told. Those four are the `include` rows below. The two things that are not
    # data are the two extra steps stock needs and the fork does not, and they
    # carry an `if:` saying so.
    strategy:
      # Both are asked, always. A green suite on one firmware says nothing about
      # the other, and fail-fast would stop it being asked.
      fail-fast: false
      matrix:
        include:
          # The 3rdIteration fork. 80 test files, about 22,000 lines.
          - firmware: smartcard
            # Five dependencies the build table deliberately leaves out because
            # they are compiled extensions that Pyodide supplies in the browser
            # (the reasons are written out above that table). There is no
            # Pyodide here, so they come from upstream's own requirements.txt at
            # upstream's own versions, read from the pinned clone rather than
            # written down here. All five are `name==version` rows.
            compiled_pattern: '^(Pillow|pycryptodomex|cryptography|cffi|pycparser)[=<>]'
            compiled_count: 5
            # See the long note in the run step.
            pytest_args: '--ignore=tests/test_smartcard_hardware.py'
            # The fork's tests/conftest.py puts the wallet on sys.path itself.
            src_on_path: ''

          # Stock SeedSigner. 23 test files, about 4,700 lines.
          - firmware: stock
            # Stock's requirements.txt is five lines and our table pins three of
            # them. The other two are the ones a zip cannot carry: Pillow is a
            # compiled extension Pyodide supplies, and pyzbar binds libzbar,
            # which has no WebAssembly build (src/fakes/pyzbar stands in for it
            # in the browser, and must not stand in for it here). pyzbar's row
            # is a `name @ git+...` line rather than `name==`, hence the wider
            # character class.
            compiled_pattern: '^(Pillow|pyzbar)[=<> @]'
            compiled_count: 2
            # Nothing to ignore. Stock has no hardware-in-the-loop file, and
            # every test it collects runs.
            pytest_args: ''
            # Stock has no conftest.py at the root of tests/, so nothing puts
            # the wallet on sys.path. Without this, 21 files fail to import.
            src_on_path: 'src'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          # No `cache:` key deliberately. setup-python's pip cache is keyed on a
          # requirements file in the repository, and this job's requirements are
          # derived at runtime from the build script's table; there is nothing
          # stable to key on, and a stale wheel is precisely the failure mode
          # this job exists to catch.

      # Stock only. pyzbar is a ctypes wrapper: it looks the shared library up
      # by name at import time, so libzbar has to be in the linker cache or the
      # import raises. Stock's decode_qr.py imports pyzbar at module scope with
      # no try/except, so without this seven test files fail during collection.
      # The fork guards the same import and needs none of this.
      #
      # libzbar0 is a virtual package on noble and apt resolves it to its one
      # provider, libzbar0t64. --no-install-recommends is what keeps the
      # optional ImageMagick and ghostscript chain, about 40 packages, out of a
      # job that needs three shared libraries.
      - name: Install libzbar
        if: matrix.firmware == 'stock'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libzbar0

      - name: Clone upstream at the pin
        env:
          FIRMWARE: ${{ matrix.firmware }}
        run: |
          set -euo pipefail

          # Same section-aware awk idiom build-wallet-zip.sh reads the pin with,
          # against the same file. One place to look, one place to change, and
          # section-aware because UPSTREAM describes two firmwares: a parser that
          # ignored the headers would clone the other one.
          field() {
            awk -F= -v want="[${FIRMWARE}]" -v key="$1" '
                /^\[/   { inside = ($0 == want); next }
                inside && $1 ~ "^[[:space:]]*" key "[[:space:]]*$" {
                    gsub(/[[:space:]]/, "", $2); print $2
                }
            ' UPSTREAM
          }

          repo="$(field repo)"
          commit="$(field commit)"
          tag="$(field tag)"
          [ -n "${repo}" ]   || { echo "no 'repo =' line in UPSTREAM [${FIRMWARE}]" >&2; exit 1; }
          [ -n "${commit}" ] || { echo "no 'commit =' line in UPSTREAM [${FIRMWARE}]" >&2; exit 1; }

          echo "firmware  ${FIRMWARE}"
          echo "upstream  ${repo}"
          echo "commit    ${commit}"
          echo "tag       ${tag}"

          dir="${RUNNER_TEMP}/upstream"
          git init --quiet "${dir}"
          git -C "${dir}" remote add origin "${repo}"
          git -C "${dir}" fetch --quiet --depth 1 origin "${commit}"
          git -C "${dir}" -c advice.detachedHead=false checkout --quiet FETCH_HEAD

          # git verifies the object graph hashes to what we asked for, so landing
          # on the right sha is the whole integrity check.
          head="$(git -C "${dir}" rev-parse HEAD)"
          [ "${head}" = "${commit}" ] || { echo "checkout landed on ${head}, expected ${commit}" >&2; exit 1; }

          echo "UPSTREAM_DIR=${dir}" >> "$GITHUB_ENV"

      - name: Work out this repository's pinned dependency set
        env:
          FIRMWARE: ${{ matrix.firmware }}
          COMPILED_PATTERN: ${{ matrix.compiled_pattern }}
          COMPILED_COUNT: ${{ matrix.compiled_count }}
        run: |
          set -euo pipefail

          # The authoritative list is the DEPENDENCIES table inside
          # build-wallet-zip.sh: the same rows that decide what goes into the
          # wallet zip, version and sha256 and all. Read out of the script rather
          # than duplicated here, for the same reason the upstream sha is: a copy
          # is a thing that can drift.
          #
          # Scoped to this firmware's branch of the case statement, because the
          # script now holds two heredocs and a reader that only watched for
          # `<<DEPS` and `DEPS` would re-arm on the second one and hand back both
          # tables concatenated.
          awk -v want="${FIRMWARE})" '
              $0 == want          { firmware = 1 }
              firmware && /^DEPS$/ { exit }
              firmware && inside  { print }
              firmware && /<<.DEPS./ { inside = 1 }
          ' build/build-wallet-zip.sh > "${RUNNER_TEMP}/pins.txt"
          [ -s "${RUNNER_TEMP}/pins.txt" ] || { echo "could not read the ${FIRMWARE} dependency table out of build/build-wallet-zip.sh" >&2; exit 1; }

          # The pypi rows become a hash-pinned requirements file pointing at the
          # exact artifacts the build fetches, same URL and same sha256, so what
          # the tests import is byte for byte what the wallet zip is built from.
          awk -F'|' '$1=="pypi" { printf "%s @ %s --hash=sha256:%s\n", $3, $5, $6 }' \
              "${RUNNER_TEMP}/pins.txt" > "${RUNNER_TEMP}/req-ours.txt"

          # The dependencies the table deliberately leaves out, taken from
          # upstream's own requirements.txt at upstream's own versions. Which
          # ones, and how many there should be, is this firmware's matrix row.
          # The count is asserted so that an upstream that drops or renames one
          # fails here, loudly, rather than quietly testing without it.
          grep -E "${COMPILED_PATTERN}" \
               "${UPSTREAM_DIR}/requirements.txt" > "${RUNNER_TEMP}/req-compiled.txt"
          count="$(wc -l < "${RUNNER_TEMP}/req-compiled.txt")"
          [ "${count}" -eq "${COMPILED_COUNT}" ] || { echo "expected ${COMPILED_COUNT} compiled dependencies in upstream's requirements.txt, found ${count}" >&2; exit 1; }

          echo "=== our pins, from build/build-wallet-zip.sh [${FIRMWARE}] ==="
          cat "${RUNNER_TEMP}/req-ours.txt"
          echo
          echo "=== compiled dependencies, from upstream's requirements.txt ==="
          cat "${RUNNER_TEMP}/req-compiled.txt"

      - name: Install
        env:
          SRC_ON_PATH: ${{ matrix.src_on_path }}
        run: |
          set -euo pipefail

          # Order matters: ours go on last, with --no-deps, so that if a pin ever
          # disagrees with what upstream's resolver would have picked, ours is
          # what the tests run against. That is the entire point of the job.
          python -m pip install --disable-pip-version-check -r "${RUNNER_TEMP}/req-compiled.txt"
          python -m pip install --disable-pip-version-check -r "${UPSTREAM_DIR}/tests/requirements.txt"
          python -m pip install --disable-pip-version-check \
              --no-deps --force-reinstall --require-hashes -r "${RUNNER_TEMP}/req-ours.txt"

          # Any git-pinned dependencies are placed on PYTHONPATH rather than
          # installed, at <clone>/<subpath>, which is exactly where
          # build-wallet-zip.sh looks for them before copying them into the zip.
          # They are pure Python and flat on sys.path in the browser too, so this
          # is the same arrangement the wallet actually runs under, and it needs
          # no packaging metadata that the pin does not contain. Stock pins none,
          # so on that leg this loop does nothing.
          pythonpath=""
          while IFS='|' read -r kind module dist release url integrity subpath; do
            [ "${kind}" = "git" ] || continue
            dir="${RUNNER_TEMP}/dep-${module}"
            git init --quiet "${dir}"
            git -C "${dir}" remote add origin "${url}"
            git -C "${dir}" fetch --quiet --depth 1 origin "${integrity}"
            git -C "${dir}" -c advice.detachedHead=false checkout --quiet FETCH_HEAD
            head="$(git -C "${dir}" rev-parse HEAD)"
            [ "${head}" = "${integrity}" ] || { echo "${module}: checkout landed on ${head}, expected ${integrity}" >&2; exit 1; }
            echo "git dependency ${module} (${dist}) at ${integrity}"
            pythonpath="${pythonpath}${pythonpath:+:}${dir}/${subpath}"
          done < "${RUNNER_TEMP}/pins.txt"

          # The wallet itself, where the firmware needs saying. `pip install -e .`
          # would also work and gives an identical result; a path needs no build
          # backend, no setuptools download and no editable-install machinery,
          # and it is the same arrangement the git dependencies above get.
          if [ -n "${SRC_ON_PATH:-}" ]; then
            pythonpath="${pythonpath}${pythonpath:+:}${UPSTREAM_DIR}/${SRC_ON_PATH}"
          fi

          echo "PYTHONPATH=${pythonpath}" >> "$GITHUB_ENV"

      # Stock only. Five of its tests assert that a string comes back
      # translated. The catalogues are a git submodule that ships .po sources
      # and no compiled .mo, and gettext reads only .mo, so without both halves
      # of this step those five fail on `assert 'Home' != 'Home'`: the
      # untranslated string coming back.
      #
      # The submodule is named rather than fetched with --recursive, because the
      # other one, seedsigner-screenshots, is marked `update = none` in
      # .gitmodules and holds nothing any test reads. --depth 1 is safe against
      # the shallow clone above: git falls back to fetching the recorded sha by
      # name when it is not the submodule branch's tip.
      #
      # Babel comes from upstream's own l10n requirements file, at upstream's own
      # versions, like everything else here that is not one of our pins.
      - name: Fetch and compile stock's translation catalogues
        if: matrix.firmware == 'stock'
        run: |
          set -euo pipefail
          git -C "${UPSTREAM_DIR}" submodule update --init --depth 1 \
              src/seedsigner/resources/seedsigner-translations
          python -m pip install --disable-pip-version-check \
              -r "${UPSTREAM_DIR}/l10n/requirements-l10n.txt"
          cd "${UPSTREAM_DIR}"
          python setup.py compile_catalog

      - name: Show what is actually installed
        run: |
          set -euo pipefail
          # So a reader of a green run can see which versions it was green
          # against, without having to reconstruct them from the pins.
          #
          # One oddity worth expecting on the stock leg: urtypes lists itself as
          # 0.0.0, because its 1.0.1 sdist carries no usable version metadata.
          # The artifact is hash-checked and the code is 1.0.1; only the label
          # pip prints is wrong.
          python -m pip list --format=columns
          echo
          # On the smartcard leg pyscard is expected to be missing and is the
          # only thing pip should complain about; see the note in the run step
          # below. Printed rather than enforced, because a second complaint
          # appearing here is information, not a reason to fail before the tests
          # have run.
          python -m pip check || true

      - name: Run upstream's suite
        env:
          PYTEST_ARGS: ${{ matrix.pytest_args }}
        run: |
          set -euo pipefail

          # PYTEST_ARGS is empty for stock and one --ignore for the smartcard
          # fork. It is not a blanket ignore and it is not a bare `|| true`:
          # everything else in both suites runs and a single failure anywhere
          # fails this job.
          #
          #   tests/test_smartcard_hardware.py  (50 tests, smartcard only)
          #
          #     Its own docstring calls it "hardware-in-the-loop" and lists what
          #     it requires: a PC/SC smartcard reader, a blank JavaCard with the
          #     default GlobalPlatform key, and pyscard. There is no reader on a
          #     CI runner, so all 50 of its tests skip themselves at
          #     "No PC/SC smartcard reader detected" -- nothing is being hidden
          #     by not collecting them, because none of them can execute here.
          #
          #     It has to be --ignore rather than --deselect because the damage
          #     is done at import time, during collection, before any test runs.
          #     Lines 37-41 of that file delete the MagicMock shims for pysatochip
          #     out of sys.modules so the real library can talk to a real card.
          #     Nothing puts them back, so every later test that reaches
          #     pysatochip imports it for real; the real pysatochip imports
          #     `smartcard.CardType` from pyscard, and pyscard is one of the
          #     hardware seams this repository replaces (src/smartcard/ is a
          #     simulated card, and there are no Linux wheels for pyscard -- it
          #     needs swig and libpcsclite to build against a PC/SC daemon that
          #     is not there). Upstream never sees this because upstream installs
          #     pyscard. Three tests in test_bip85_gpg.py fail this way, and they
          #     pass if that file is simply collected in a different order, which
          #     is what makes it a collection-order fault in the suite rather
          #     than anything about the wallet or about our pins.
          #
          # Stock's tests/screenshot_generator/ is not collected either, and by
          # nobody's decision: its only test module is named generator.py, which
          # does not match pytest's default python_files, which is why upstream
          # runs it as a separate CI step. Nothing here needs to say so.
          #
          # cwd is the clone root for both, because tests do their own relative
          # sys.path work that assumes it.
          #
          # No coverage is measured. Upstream's tests/requirements.txt brings
          # coverage and pytest-cov along and they are installed as upstream
          # specifies, but this job runs neither: it asks whether the tests pass
          # against our pins, not how much of the wallet they touch.
          #
          # -rs lists every skip and its reason, so the difference between "ran"
          # and "skipped itself" is in the output rather than in a total.
          cd "${UPSTREAM_DIR}"
          # shellcheck disable=SC2086
          python -m pytest tests/ ${PYTEST_ARGS:-} -rs -q
